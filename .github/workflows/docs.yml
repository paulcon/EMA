# EMA's documentation site (record 0088): built and published to https://paulcon.github.io/EMA/, started by hand
# only, from main only.
name: docs

on:
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

# One deployment at a time; one in progress finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: build and publish the site (3.14)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run sphinx-build -W --keep-going docs docs/_build/html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html
      - id: deployment
        uses: actions/deploy-pages@v4
